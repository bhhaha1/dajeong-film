<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다정필름">
<meta name="description" content="일상을 오래된 필름 감성으로 찍는 카메라">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>다정필름</title>
</head>
<body>
<main id="app">
  <header class="topbar">
    <button id="btnFlash" class="tool" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg><span>플래시</span>
    </button>
    <button id="btnTimer" class="tool" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span id="timerLabel">타이머</span>
    </button>
    <button id="btnDate" class="tool" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>날짜</span>
    </button>
    <button id="btnFrame" class="tool" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><rect x="7" y="6" width="10" height="9"/></svg><span id="frameLabel">프레임</span>
    </button>
    <button id="btnMore" class="tool" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>설정</span>
    </button>
  </header>

  <section class="finder" id="finder" aria-label="뷰파인더. 좌우로 밀어 필터를 바꿀 수 있어요">
    <canvas id="view" role="img" aria-label="필터가 입혀진 미리보기"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="finder-msg" id="msg" hidden>
      <p id="msgText"></p>
      <button id="msgRetry" class="pill">카메라 다시 켜기</button>
    </div>
    <div class="countdown" id="countdown" aria-live="assertive"></div>
    <div class="filter-toast" id="filterToast" aria-live="polite"></div>
    <div class="rec-badge" id="recBadge" hidden><i></i><span id="recTime">0:00</span></div>
    <div class="edit-bar" id="editBar" hidden>
      <span>불러온 사진에 필터를 입히는 중</span>
      <button id="btnBack" class="pill">카메라로</button>
    </div>
  </section>

  <section class="deck">
    <div class="lcd" aria-live="polite">
      <span class="lcd-name" id="lcdName"></span>
      <span class="lcd-desc" id="lcdDesc"></span>
      <span class="lcd-no" id="lcdNo"></span>
    </div>
    <div class="strip" id="strip" role="listbox" aria-label="필터"></div>
    <div class="controls">
      <button id="btnAlbum" class="album" aria-label="앨범 열기"><img id="albumThumb" alt=""><span id="albumCount" class="count"></span></button>
      <button id="shutter" class="shutter" aria-label="사진 찍기"><i></i></button>
      <button id="btnFlip" class="round" aria-label="앞뒤 카메라 바꾸기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11l-3-3M20 15H9l3 3"/></svg>
      </button>
    </div>
    <div class="modes">
      <div class="seg" role="radiogroup" aria-label="촬영 방식">
        <button id="modePhoto" role="radio" aria-checked="true">사진</button>
        <button id="modeVideo" role="radio" aria-checked="false">영상</button>
      </div>
      <button id="btnImport" class="pill ghost">사진 불러오기</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </section>
</main>

<div class="flash" id="flash" aria-hidden="true"></div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toastText"></span>
  <button id="toastSave" class="pill" hidden>휴대폰에 저장</button>
</div>

<div class="sheet" id="frameSheet" role="dialog" aria-modal="true" aria-labelledby="frameTitle" hidden>
  <div class="sheet-body">
    <h2 id="frameTitle">프레임</h2>
    <div class="frames" id="frames"></div>
    <button class="pill wide" data-close>닫기</button>
  </div>
</div>

<div class="sheet" id="moreSheet" role="dialog" aria-modal="true" aria-labelledby="moreTitle" hidden>
  <div class="sheet-body">
    <h2 id="moreTitle">설정</h2>
    <div class="row">
      <span>카메라 화질</span>
      <div class="seg small" role="radiogroup" aria-label="카메라 화질">
        <button data-quality="high" role="radio">높음</button>
        <button data-quality="std" role="radio">보통</button>
      </div>
    </div>
    <p class="hint">높음은 카메라가 주는 가장 큰 크기로 찍어요. 미리보기가 끊기면 보통으로 바꿔 주세요.</p>
    <div class="row">
      <span>영상에 소리 넣기</span>
      <div class="seg small" role="radiogroup" aria-label="영상 소리">
        <button data-mic="on" role="radio">켜기</button>
        <button data-mic="off" role="radio">끄기</button>
      </div>
    </div>
    <details>
      <summary>홈 화면에 추가하기</summary>
      <p><b>아이폰</b>: 사파리에서 이 페이지를 열고 아래 공유 버튼 → '홈 화면에 추가'.</p>
      <p><b>안드로이드</b>: 크롬 오른쪽 위 ⋮ → '홈 화면에 추가' 또는 '앱 설치'.</p>
      <p>찍은 사진은 이 기기 브라우저 안에만 있어요. 아끼는 사진은 '휴대폰에 저장'으로 사진 앱에 옮겨 두세요.</p>
    </details>
    <button class="pill wide" data-close>닫기</button>
  </div>
</div>

<div class="album-view" id="album" role="dialog" aria-modal="true" aria-labelledby="albumTitle" hidden>
  <header>
    <button class="pill ghost" data-close>닫기</button>
    <h2 id="albumTitle">앨범</h2>
    <button class="pill" id="btnExhibit">전시 보기</button>
  </header>
  <div class="grid" id="grid"></div>
  <p class="empty" id="albumEmpty" hidden>아직 찍은 사진이 없어요.<br>첫 장을 찍어 보세요.</p>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 보기" hidden>
  <div class="stage" id="stage"></div>
  <p class="meta" id="viewerMeta"></p>
  <footer>
    <button class="round light" id="viewerPrev" aria-label="이전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pill" id="viewerSave">휴대폰에 저장</button>
    <button class="pill ghost light" id="viewerDelete">지우기</button>
    <button class="round light" id="viewerNext" aria-label="다음"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
  <button class="close" data-close aria-label="닫기">×</button>
</div>

<div class="exhibit" id="exhibit" role="dialog" aria-modal="true" aria-label="전시 보기, 누르면 닫혀요" hidden>
  <img id="exA" alt=""><img id="exB" alt="">
  <p class="caption" id="exCaption"></p>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
